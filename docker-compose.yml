# Homeroom: local-first sports engine + TV views + Home Assistant bridge.
#   cp .env.example .env   # set PUBLIC_BASE_URL to http://<this-machine's-LAN-IP>:8080
#   docker compose up -d --build
services:
  homeroom:
    build: .
    image: homeroom:local
    container_name: homeroom
    restart: unless-stopped
    # nothing in the app needs privileges: it listens on 8080 and writes only to the two volumes below
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${PORT:-8080}:8080"
    environment:
      TZ: ${TZ:-America/Toronto}
      # URL your speakers / Home Assistant use to reach this container (goal horn links are built from it)
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # optional: require `Authorization: Bearer <token>` on mutating /api calls
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      # optional: browser origins besides this server that may call the API (host[:port], comma separated)
      HOMEROOM_ALLOWED_ORIGINS: ${HOMEROOM_ALLOWED_ORIGINS:-}
    volumes:
      - ./data:/data     # SQLite database + settings (persistent)
      - ./media:/media   # goal horns: media/horns/<league>/<ABBR>.mp3 (persistent, also uploadable in the UI)
