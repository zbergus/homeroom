name: Feature Request
description: Suggest an idea or enhancement for Homeroom
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please keep in mind that Homeroom is focused strictly on dedicated hockey watching for local home setups.
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation?
      placeholder: I'm always frustrated when...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution or enhancement you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false
