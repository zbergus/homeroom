name: Bug Report
description: Report an issue or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please check existing issues first to see if this has already been reported.
  - type: input
    id: environment
    attributes:
      label: Deployment Environment
      description: How are you running Homeroom?
      placeholder: e.g. Docker Compose, Node 22 on Linux/macOS
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Affected League / Feed
      description: If this issue is related to game data or polling, select the league.
      options:
        - NHL
        - AHL
        - ESPN (International Hockey)
        - Not related to game feeds / General
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: What steps led to the issue?
      placeholder: |
        1. Start game watching for ...
        2. Score event occurred ...
        3. Observed ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Diagnostics
      description: Please paste any relevant container or server logs (redacting any private details).
      render: shell
    validations:
      required: false
